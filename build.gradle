plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'  // Latest Spring Boot 2.x (supports Java 8)
    id 'io.spring.dependency-management' version '1.1.4'  // Updated for compatibility
}

group = 'com.example'
version = '1.0-SNAPSHOT'
sourceCompatibility = '1.8'  // Keep Java 8

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'net.logstash.logback:logstash-logback-encoder:5.2'  // Use `implementation` instead of `compile`
    testImplementation 'junit:junit:4.13.2'  // Use `testImplementation` instead of `testCompile`
}

// Optional: Ensure bootJar task works correctly
bootJar {
    mainClass = 'com.example.YourMainClass'  // Replace with your main class
}
