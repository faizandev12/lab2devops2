name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-java:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java-version: [17] # Update to match your project's Java version

    steps:
      - uses: actions/checkout@v4 # Update from v2 to v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v3 # Update from v1 to v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Grant execute permission for gradlew (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./gradlew.bat build
          else
            ./gradlew build
          fi

      # Optional: Keep Docker steps ONLY if required by your lab/diagram
      - name: Build and Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v4
        with:
          image: nanajanashia/demo-app
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
